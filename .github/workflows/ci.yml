name: CI

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

env:
  TZ: UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Revisión de las dependencias que añade o cambia el PR, con la base de avisos de GitHub (ADR-16). Bloquea las
  # vulnerabilidades altas o críticas de ejecución y las críticas de desarrollo; el resto aparece como aviso.
  # allow-ghsas = descartes vigentes de la tabla de excepciones de la ADR-16 (EXC-01 y EXC-06).
  dependencias:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Ejecución (bloquea altas y críticas)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          comment-summary-in-pr: on-failure
      - name: Desarrollo (bloquea críticas)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0
        with:
          fail-on-severity: critical
          fail-on-scopes: development
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          comment-summary-in-pr: on-failure
      - name: Avisos (medias y bajas, y altas de desarrollo; no bloquea)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0 
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          warn-only: true

  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Las pruebas no usan dependencias externas: basta el Node del runner.
      - name: Ejecutar pruebas
        run: npm test

  linting:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.custom.hcl
          VALIDATE_JSCPD: false
          VALIDATE_CHECKOV: false
          VALIDATE_CLOUDFORMATION: false
          VALIDATE_TERRAFORM_TERRASCAN: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_MARKDOWN_PRETTIER: false
          FIX_YAML_PRETTIER: true
          VALIDATE_BIOME_LINT: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_TRIVY: false
          FIX_TERRAFORM_FMT: true
          FILTER_REGEX_EXCLUDE: (.*github/linters.*|.*CHANGELOG.md.*|.*specify/.*|.*\.agents/.*)
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          VALIDATE_SPELL_CODESPELL: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          